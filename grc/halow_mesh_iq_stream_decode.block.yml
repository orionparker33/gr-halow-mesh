id: halow_mesh_iq_stream_decode
label: HaLow S1G IQ Stream Decode
category: '[HaLow / Mesh]'
flags: [python]
parameters:
- id: sample_rate
  label: Sample rate (S/s)
  dtype: real
  default: 10000000
- id: bandwidth_mhz
  label: Channel width (MHz)
  dtype: enum
  options: ['1', '2', '4', '8']
  option_labels: ['1 MHz', '2 MHz', '4 MHz', '8 MHz']
  default: '8'
- id: offset_hz
  label: Channel offset (Hz)
  dtype: real
  default: 0
- id: window_seconds
  label: Window (s)
  dtype: real
  default: 0.1
- id: overlap_seconds
  label: Overlap (s)
  dtype: real
  default: 0.03
- id: max_candidates
  label: Maximum candidates per window
  dtype: int
  default: 8
- id: stf_threshold
  label: Raw preamble threshold (0-1)
  dtype: real
  default: 0.75
inputs:
- domain: stream
  dtype: complex
outputs:
- domain: message
  id: out
templates:
  imports: from gnuradio import halow_mesh
  make: halow_mesh.iq_stream_decode(${sample_rate}, ${bandwidth_mhz}, ${offset_hz}, ${window_seconds}, ${overlap_seconds}, ${max_candidates}, ${stf_threshold})
file_format: 1
