id: halow_mesh_pcap_source
label: HaLow / 802.11s PCAP Source
category: '[HaLow Mesh]'
documentation: |-
  Read classic radiotap or raw 802.11 PCAP once and emit recovered MPDU PDUs.
  Connect to HaLow / 802.11s Mesh Decode. The radio already demodulated PHY.
templates:
  imports: from gnuradio import halow_mesh
  make: halow_mesh.pcap_source(${path})
parameters:
- id: path
  label: PCAP path
  dtype: string
  default: 'capture.pcap'
outputs:
- label: out
  domain: message
file_format: 1
